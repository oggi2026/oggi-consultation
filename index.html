<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGGI 鮮食客製化諮詢表單</title>
    <style>
        :root { --primary-color: #bfa07d; --text-main: #333333; --border-color: #e0e0e0; }
        body { background-color: #fcfcfc; font-family: "PingFang TC","Microsoft JhengHei",sans-serif; color: var(--text-main); margin:0; padding:40px 20px; }
        .container { max-width:600px; margin:0 auto; background:#fff; padding:40px; border:1px solid #f0f0f0; }
        header { text-align:center; margin-bottom:50px; }
        h1 { font-size:18px; letter-spacing:4px; font-weight:400; margin:0; }
        .section-title { font-size:11px; color:var(--primary-color); letter-spacing:2px; margin:40px 0 15px 0; border-bottom:1px solid #f5f5f5; padding-bottom:5px; font-weight:600; }
        .form-group { margin-bottom:25px; }
        label { display:block; font-size:13px; margin-bottom:8px; font-weight:500; }
        input[type="text"], input[type="tel"], input[type="number"], textarea { width:100%; padding:8px 0; border:none; border-bottom:1px solid var(--border-color); font-size:14px; background:transparent; box-sizing:border-box; }
        .options-group { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; margin-top:5px; }
        .option-item { font-size:12px; color:#666; display:flex; align-items:center; cursor:pointer; }
        .option-item input { margin-right:6px; }
        .other-input { width:100%; border:none; border-bottom:1px solid #eee; font-size:12px; padding:5px 0; margin-top:5px; display:block; color:#bfa07d; }
        .submit-btn { width:100%; padding:15px; background:#1a1a1a; color:white; border:none; letter-spacing:3px; cursor:pointer; margin-top:40px; }
        .footer-note { margin-top:40px; font-size:12px; color:#999; text-align:center; line-height:1.8; border-top:1px solid #f9f9f9; padding-top:20px; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>OGGI 鮮食客製化諮詢表單</h1></header>

    <!-- 表單送到你的 Web App -->
    <form id="oggi-form" action="https://script.google.com/macros/s/AKfycbxBLjfah2kw-QNDFNxamnj_IZSmOaCzVEnlKQi-MQ9fv2dHAXRrD47AJPn2klcK5oeEIw/exec" method="POST" target="hidden_iframe">

        <!-- PHASE 0: 家長聯絡 -->
        <div class="section-title">CONTACT. 家長聯絡</div>
        <div class="form-group"><label>家長姓名</label><input type="text" name="entry.1373076892" required></div>
        <div class="form-group"><label>目前居住地區</label><input type="text" name="entry.441119790" placeholder="例如：台北市大安區"></div>
        <div class="form-group"><label>聯絡電話</label><input type="tel" name="entry.1833926884" required></div>
        <div class="form-group"><label>Line ID</label><input type="text" name="entry.1824022639" required></div>

        <!-- PHASE 1: 毛孩生理數據 -->
        <div class="section-title">PHASE 1. 毛孩生理數據</div>
        <div class="form-group"><label>毛孩姓名</label><input type="text" name="entry.771549081" required></div>
        <div class="form-group"><label>品種</label><input type="text" name="entry.179917053"></div>
        <div class="form-group"><label>生日 / 年齡</label><input type="text" name="entry.922681677" placeholder="例如：19歲"></div>
        <div class="form-group">
            <label>性別與結紮</label>
            <div class="options-group">
                <label class="option-item"><input type="radio" name="entry.1897446138" value="男生已結紮"> 男生已結紮</label>
                <label class="option-item"><input type="radio" name="entry.1897446138" value="男生未結紮"> 男生未結紮</label>
                <label class="option-item"><input type="radio" name="entry.1897446138" value="女生已結紮"> 女生已結紮</label>
                <label class="option-item"><input type="radio" name="entry.1897446138" value="女生未結紮"> 女生未結紮</label>
            </div>
        </div>
        <div class="form-group"><label>目前體重 (kg)</label><input type="number" name="entry.1884086175" step="0.1"></div>

        <!-- PHASE 2: 生活與體態 -->
        <div class="section-title">PHASE 2. 生活與體態</div>
        <div class="form-group">
            <label>居住環境</label>
            <div class="options-group">
                <label class="option-item"><input type="radio" name="entry.1846814604" value="純室內"> 純室內</label>
                <label class="option-item"><input type="radio" name="entry.1846814604" value="有大陽台或庭院"> 有大陽台或庭院</label>
                <label class="option-item"><input type="radio" name="entry.1846814604" value="半戶外"> 半戶外</label>
            </div>
        </div>
        <div class="form-group">
            <label>體態觀察</label>
            <div class="options-group">
                <label class="option-item"><input type="radio" name="entry.577005833" value="過瘦"> 過瘦</label>
                <label class="option-item"><input type="radio" name="entry.577005833" value="標準"> 標準</label>
                <label class="option-item"><input type="radio" name="entry.577005833" value="稍微肉肉"> 稍微肉肉</label>
                <label class="option-item"><input type="radio" name="entry.577005833" value="肥胖"> 肥胖</label>
            </div>
        </div>
        <div class="form-group">
            <label>活動量</label>
            <div class="options-group">
                <label class="option-item"><input type="radio" name="entry.540942679" value="幾乎不動"> 幾乎不動</label>
                <label class="option-item"><input type="radio" name="entry.540942679" value="每日散步 30 分鐘內"> 每日散步 30 分鐘內</label>
                <label class="option-item"><input type="radio" name="entry.540942679" value="每日運動 1 小時以上"> 每日運動 1 小時以上</label>
                <label class="option-item"><input type="radio" name="entry.540942679" value="高強度工作犬"> 高強度工作犬</label>
            </div>
        </div>

        <!-- PHASE 3: 飲食與偏好 -->
        <div class="section-title">PHASE 3. 飲食與偏好</div>
        <div class="form-group"><label>目前主要食用的品牌與產品名</label><input type="text" name="entry.90579357"></div>
        <div class="form-group">
            <label>挑食程度</label>
            <div class="options-group">
                <label class="option-item"><input type="radio" name="entry.1288700040" value="極度挑食"> 極度挑食</label>
                <label class="option-item"><input type="radio" name="entry.1288700040" value="普通"> 普通</label>
                <label class="option-item"><input type="radio" name="entry.1288700040" value="不挑食"> 不挑食</label>
            </div>
        </div>
        <div class="form-group"><label>喜愛吃的食材</label><input type="text" name="entry.920789842"></div>
        <div class="form-group"><label>討厭或不吃的食材</label><input type="text" name="entry.1452556794"></div>

        <!-- PHASE 4: 健康狀況 -->
        <div class="section-title">PHASE 4. 健康狀況</div>
        <div class="form-group">
            <label>過敏原調查 (已知過敏食材，可多選)</label>
            <div class="options-group">
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="無"> 無</label>
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="雞肉"> 雞肉</label>
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="牛肉"> 牛肉</label>
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="鴨肉"> 鴨肉</label>
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="魚肉"> 魚肉</label>
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="穀類"> 穀類</label>
                <label class="option-item"><input type="checkbox" name="entry.2006133143" value="__other_option__"> 其他</label>
            </div>
            <input type="text" name="entry.2006133143.other_option_response" class="other-input" placeholder="請填寫其他過敏食材">
        </div>
        <div class="form-group">
            <label>慢性病史 (可多選)</label>
            <div class="options-group">
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="無"> 無</label>
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="腎臟疾病"> 腎臟疾病</label>
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="胰臟炎"> 胰臟炎</label>
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="心臟病"> 心臟病</label>
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="糖尿病"> 糖尿病</label>
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="下尿路結石"> 下尿路結石</label>
                <label class="option-item"><input type="checkbox" name="entry.67108584" value="__other_option__"> 其他</label>
            </div>
            <input type="text" name="entry.67108584.other_option_response" class="other-input" placeholder="請填寫其他病史">
        </div>
        <div class="form-group">
            <label>目前是否正在服用保健品 (可多選)</label>
            <div class="options-group">
                <label class="option-item"><input type="checkbox" name="entry.2037272317" value="魚油"> 魚油</label>
                <label class="option-item"><input type="checkbox" name="entry.2037272317" value="關節保健"> 關節保健</label>
                <label class="option-item"><input type="checkbox" name="entry.2037272317" value="益生菌"> 益生菌</label>
                <label class="option-item"><input type="checkbox" name="entry.2037272317" value="皮膚藥"> 皮膚藥</label>
                <label class="option-item"><input type="checkbox" name="entry.2037272317" value="中藥"> 中藥</label>
                <label class="option-item"><input type="checkbox" name="entry.2037272317" value="__other_option__"> 其他</label>
            </div>
            <input type="text" name="entry.2037272317.other_option_response" class="other-input" placeholder="請填寫其他保健品">
        </div>

        <!-- PHASE 5: 諮詢重點與備註 -->
        <div class="section-title">PHASE 5. 諮詢重點與備註</div>
        <div class="form-group">
            <label>最希望改善或關注之問題 (可多選)</label>
            <div class="options-group">
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="腸胃穩定"> 腸胃穩定</label>
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="體重控制"> 體重控制</label>
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="腎臟保養"> 腎臟保養</label>
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="皮膚／毛髮狀況"> 皮膚／毛髮狀況</label>
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="食慾改善"> 食慾改善</label>
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="老年保養"> 老年保養</label>
                <label class="option-item"><input type="checkbox" name="entry.1934572734" value="__other_option__"> 其他</label>
            </div>
            <input type="text" name="entry.1934572734.other_option_response" class="other-input" placeholder="請填寫其他關注問題">
        </div>
        <div class="form-group">
            <label>特殊需求備註 (例如：牙口不好需要打碎)</label>
            <textarea name="entry.373516377" rows="3"></textarea>
        </div>

        <button type="submit" class="submit-btn">提交諮詢</button>
    </form>

    <div class="footer-note">
        感謝提供資訊。我會為您的毛孩配置專屬方案。<br>
        提交後請加入 LINE 並傳送<strong>「體態照片/血檢報告」</strong>：<br>
        <div style="margin-top:15px;">
            <a href="https://lin.ee/7pBa3z5">
                <img src="https://scdn.line-apps.com/n/line_add_friends/btn/zh-Hant.png" alt="加入好友" height="36" border="0">
            </a>
        </div>
    </div>
</div>

<!-- 隱藏 iframe -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<!-- 提交提示 -->
<script>
document.querySelector('#oggi-form').onsubmit = function() {
    alert('資訊已收到！\n\n請記得點擊下方的 LINE 按鈕傳送照片資料，謝謝！');
};
</script>

</body>
</html>
